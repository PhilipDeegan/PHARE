name: build

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read
  actions: write # the fail fast step cancels the run

jobs:
  cmake:
    runs-on: ${{ matrix.os }}
    container: ghcr.io/pharchive/phare_dep/ubuntu:24.04
    strategy:
      fail-fast: false # disabled for now, see the cancel step
      matrix:
        os: [ubuntu-latest]
        cc: [gcc, clang]
    steps:
    - name: Build Info
      run: |
        uname -a
        gcc -v
        clang -v
    - name: CCache
      id: cache
      uses: actions/cache@v4
      with:
        path: ~/.ccache
        key: ${{ runner.os }}-ccache-${{ hashFiles('hashFile.txt') }}
        restore-keys: ${{ runner.os }}-ccache-
    - uses: actions/checkout@v6
    - name: Ensure ccache uses ~/.ccache
      run: |
          mkdir -p ~/.ccache
          ccache --set-config=cache_dir=~/.ccache
          ccache --get-config=cache_dir
    - name: Configure CMake
      run: |
        set -ex
        export CC=gcc CXX=g++
        [ "${{ matrix.cc }}" = "clang" ] && export CC=clang CXX=clang++
        . /.venv/bin/activate;
        mkdir -p build && cd build
        cmake .. -DCMAKE_VERBOSE_MAKEFILE:BOOL=ON --fresh \
              -DSAMRAI_ROOT=/usr/local \
              -DCMAKE_BUILD_TYPE=Debug -Dasan=OFF \
              -DCMAKE_C_COMPILER_LAUNCHER=ccache \
              -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
              -DPHARE_PYTEST_SIMULATORS=1 -DdevMode=ON -Dbench=ON \
              -DCMAKE_CXX_FLAGS="-O2 -DPHARE_DIAG_DOUBLES=1" -Dphare_configurator=ON
    - name: Build
      working-directory: ${{github.workspace}}/build
      run: . /.venv/bin/activate; cmake --build .
    - name: Test
      working-directory: ${{github.workspace}}/build
      run: . /.venv/bin/activate; ctest -j 2 --output-on-failure
    - &cancel_run
      name: Fail fast, cancel the whole run
      # matrix fail-fast only stops its own matrix: any failed job cancels every other job
      # disabled for now (if: false): let every job report, restore with if: failure()
      if: false && failure()
      continue-on-error: true
      uses: actions/github-script@v7
      with:
        script: |
          // cancelling marks this job cancelled too: say which one failed
          core.error(`fail fast: job '${context.job}' failed, cancelling the run`)
          await github.rest.actions.cancelWorkflowRun({
            owner: context.repo.owner, repo: context.repo.repo, run_id: context.runId })

  kokkos:
    runs-on: ubuntu-latest
    container: ghcr.io/pharchive/phare_dep/ubuntu:24.04
    steps:
    - uses: actions/checkout@v6
    - name: Install
      run: apt-get update && apt-get install -y curl sudo
    - name: Build
      run: |
        . /.venv/bin/activate;
        mkdir -p build && cd build
        cmake .. -DCMAKE_VERBOSE_MAKEFILE:BOOL=ON --fresh \
              -DSAMRAI_ROOT=/usr/local -DCMAKE_BUILD_TYPE=Debug \
              -DPHARE_PYTEST_SIMULATORS=1 -DdevMode=ON -DwithKokkos=ON \
              -DCMAKE_CXX_FLAGS="-O2 -DPHARE_DIAG_DOUBLES=1" -Dphare_configurator=ON
    - name: Build
      working-directory: ${{github.workspace}}/build
      run: . /.venv/bin/activate; cmake --build .
    - name: Test
      working-directory: ${{github.workspace}}/build
      run: . /.venv/bin/activate; ctest -j 2 --output-on-failure
    - *cancel_run

  mkn:
    runs-on: ubuntu-latest
    container: ghcr.io/pharchive/phare_dep/ubuntu:24.04
    steps:
    - uses: actions/checkout@v6
    - name: Install
      run: apt-get update && apt-get install -y curl sudo
    - name: "setup"
      run: |
        curl -Lo mkn https://github.com/mkn/mkn/releases/download/latest/mkn_nix
        chmod +x mkn && mv mkn /.venv/bin/mkn
        mkdir /mkn
    - name: "Build/Test"
      run: |
        . /.venv/bin/activate
        PROPS="samrai.ver=installed,HDF5_PTH=/usr/lib/x86_64-linux-gnu/hdf5/openmpi,HDF5_INC=/usr/include/hdf5/openmpi"
        CARGS="-P ${PROPS}" ./mkn.sh -O
    - *cancel_run

  mkn_cmake:
    runs-on: ubuntu-latest
    container: ghcr.io/pharchive/phare_dep/ubuntu:24.04
    steps:
    - uses: actions/checkout@v6
    - name: Install
      run: apt-get update && apt-get install -y curl sudo
    - name: Build
      run: |
        . /.venv/bin/activate;
        python3 -m pip install phlop -U
        mkdir -p build && (
          cd build && cmake .. -DCMAKE_VERBOSE_MAKEFILE:BOOL=ON --fresh \
                -DSAMRAI_ROOT=/usr/local -DCMAKE_BUILD_TYPE=Debug \
                -DPHARE_PYTEST_SIMULATORS=1 -DdevMode=ON -DwithMkn=ON \
                -DCMAKE_CXX_FLAGS="-O2 -DPHARE_DIAG_DOUBLES=1 -DPHARE_HAVE_THRUST=0 -DMKN_GPU_CPU=1" \
                -Dphare_configurator=ON
        )

    - name: Build
      working-directory: ${{github.workspace}}/build
      run: . /.venv/bin/activate; cmake --build .
    - name: Test
      working-directory: ${{github.workspace}}
      run: . /.venv/bin/activate; python3 -um phlop.run.test_cases -i build --cmake -c 2
    - *cancel_run

  # Experimental: CUDA on a simulated NVIDIA H100 (https://github.com/pantheongpu/pantheonsim),
  #  clang only (no nvcc). The simulator needs a shared cudart, PHARE links -lcudart (the .so).
  #  sm_90 (H100) with CUDA 12.6: the local profiles target sm_120, which needs CUDA >= 12.8.
  #  clang 19: clang 18 fails on libstdc++ 14's __float128 in device code.
  #  fast: mkn_cuda.sh (core + amr tests built with mkn)
  #  slow: Umpire, RAJA and SAMRAI built for CUDA (cached), PHARE via CMake on them, 1d layouts
  cuda:
    name: cuda ${{ matrix.case }} (clang 19, CUDA 12.6, simulated H100)
    runs-on: ubuntu-24.04
    container: ghcr.io/pharchive/phare_dep/ubuntu:24.04
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false # disabled for now, see the cancel step
      matrix:
        include:
          - case: fast
            timeout: 120
          - case: slow
            timeout: 345
    env:
      CUDA_ARCH: sm_90
      LLNL: /mkn/r/llnl
    steps:
    - uses: actions/checkout@v6
    - name: Install
      run: |
        apt-get update && apt-get install -y curl sudo clang-19 libnuma-dev ninja-build
        # the LLNL scripts and the mkn profiles call clang / clang++
        ln -sf /usr/bin/clang-19 /usr/local/bin/clang
        ln -sf /usr/bin/clang++-19 /usr/local/bin/clang++
        clang++ --version
    - name: Set up the simulated GPU and CUDA
      uses: pantheongpu/setup-pantheonsim@ca87fe3143b29166822b923d6050945c5179408c # v0.1.5
      with:
        gpu: nvidia/h100
        cuda-toolkit: "12.6"
        rocm: none
    - name: CUDA paths
      run: |
        # not `command -v nvcc`: that is pantheonsim's drop-in, in its build dir
        CUDA_HOME=$(readlink -f /usr/local/cuda)
        echo "CUDA_HOME=${CUDA_HOME}" >> $GITHUB_ENV
        # thrust: include/ up to CUDA 12, include/cccl from CUDA 13
        ls ${CUDA_HOME}/include/thrust/version.h 2>/dev/null \
          || ls ${CUDA_HOME}/include/cccl/thrust/version.h

    # ---- fast: mkn_cuda.sh ----
    - name: mkn profiles for this GPU
      if: matrix.case == 'fast'
      run: |
        sed -e "s/cuda.arch: 120/cuda.arch: ${CUDA_ARCH#sm_}/" -e "s|/usr/local/cuda|${CUDA_HOME}|g" \
          res/mkn/clang_cuda.yaml > res/mkn/clang_cuda_ci.yaml
        # include/cccl (thrust, cub) only from CUDA 13, before they are in include/: mkn rejects a
        #  missing include directory
        [ -d "${CUDA_HOME}/targets/x86_64-linux/include/cccl" ] \
          || sed -i '\|targets/x86_64-linux/include/cccl|d' res/mkn/clang_cuda_ci.yaml
        sed -e "s/^super: clang_cuda$/super: clang_cuda_ci/" \
          res/mkn/clang_cuda_mpi.yaml > res/mkn/clang_cuda_mpi_ci.yaml
        curl -Lo mkn https://github.com/mkn/mkn/releases/download/latest/mkn_nix
        chmod +x mkn && mv mkn /.venv/bin/mkn
        mkdir -p /mkn
    - name: Build/Test (mkn_cuda.sh)
      if: matrix.case == 'fast'
      run: |
        . /.venv/bin/activate
        PROPS="samrai.ver=installed,HDF5_PTH=/usr/lib/x86_64-linux-gnu/hdf5/openmpi,HDF5_INC=/usr/include/hdf5/openmpi"
        CARGS="-P ${PROPS}" MKN_CUDA=res/mkn/clang_cuda_ci MKN_CUDA_MPI=res/mkn/clang_cuda_mpi_ci \
          vgpu run ./mkn_cuda.sh -O

    # ---- slow: LLNL stack + CMake ----
    - name: LLNL stack versions
      if: matrix.case == 'slow'
      id: llnl
      run: |
        # the scripts build with -march=native: the cache is only valid on the same CPU model
        KEY="llnl-${CUDA_ARCH}-$(grep -m1 'model name' /proc/cpuinfo | md5sum | cut -c1-8)"
        for r in umpire raja samrai; do
          KEY="${KEY}-$(git ls-remote https://github.com/mkn-nix/llnl.$r phare | cut -c1-8)"
        done
        echo "key=${KEY}" >> $GITHUB_OUTPUT
    - name: LLNL stack cache
      if: matrix.case == 'slow'
      id: llnl_cache
      uses: actions/cache@v4
      with:
        path: /mkn/r/llnl
        key: ${{ steps.llnl.outputs.key }}
    - name: Build Umpire, RAJA, SAMRAI (CUDA)
      if: matrix.case == 'slow' && steps.llnl_cache.outputs.cache-hit != 'true'
      run: |
        for r in umpire raja samrai; do # in order, SAMRAI needs both
          git clone --depth 1 -b phare https://github.com/mkn-nix/llnl.$r ${LLNL}/$r/phare
          # from its own dir: the scripts clone their sources relative to the working directory
          (cd ${LLNL}/$r/phare && THREADS=4 CUDA_HOME=${CUDA_HOME} bash mkn.sh)
        done
    - name: Configure CMake
      if: matrix.case == 'slow'
      run: |
        . /.venv/bin/activate
        mkdir -p build && cd build
        CC=clang CXX=clang++ cmake .. -G Ninja --fresh \
          -DSAMRAI_ROOT=${LLNL}/samrai/phare \
          -DCMAKE_BUILD_TYPE=Release -DdevMode=ON -Dasan=OFF -Dtest=OFF \
          -Dphare_configurator=ON -DwithMkn=ON -DwithGPU=ON \
          -DPHARE_GPU=cuda -DPHARE_GPU_ARCH=${CUDA_ARCH} \
          -DwithRaja=ON -DwithUmpire=ON \
          -Dumpire_DIR=${LLNL}/umpire/phare/lib/cmake/umpire \
          -DRAJA_DIR=${LLNL}/raja/phare/lib/cmake/raja \
          -Dcamp_DIR=${LLNL}/raja/phare/lib/cmake/camp \
          -DCMAKE_CXX_FLAGS="-DNDEBUG -O2 -DPHARE_DIAG_DOUBLES=1"
    - name: Build (1d modules)
      if: matrix.case == 'slow'
      working-directory: ${{github.workspace}}/build
      run: |
        . /.venv/bin/activate
        ninja -j 4 cpp_etc dictator phare_initializer \
          cpp_1_1_2_AoSMapped_CPU cpp_1_1_2_AoSCMTS_CPU \
          cpp_1_1_2_AoSTS_GPU_UNIFIED cpp_1_1_2_AoSPCTS_GPU_UNIFIED
    - name: Test (1d layouts, simulated GPU)
      if: matrix.case == 'slow'
      run: |
        . /.venv/bin/activate
        PYTHONPATH=$PWD:$PWD/build:$PWD/pyphare vgpu run python3 -m tests.simulator.layouts.test_layouts_1d
    - *cancel_run

  # Experimental, non blocking until green (no fail fast step): ROCm on a simulated AMD MI300X
  #  (gfx942), hipcc from ROCm 7.1, rocThrust (res/mkn/hip_thrust.yaml), mkn_rocm.sh
  rocm:
    name: rocm fast (hipcc, ROCm 7.1, simulated MI300X)
    runs-on: ubuntu-24.04
    container: ghcr.io/pharchive/phare_dep/ubuntu:24.04
    timeout-minutes: 120
    continue-on-error: true
    steps:
    - uses: actions/checkout@v6
    - name: Install
      run: apt-get update && apt-get install -y curl sudo
    - name: Set up the simulated GPU and ROCm
      uses: pantheongpu/setup-pantheonsim@ca87fe3143b29166822b923d6050945c5179408c # v0.1.5
      with:
        gpu: amd/mi300x
        rocm: "7.1"
    - name: rocThrust
      run: |
        # the action installs hipcc and the HIP runtime only; rocThrust + rocPRIM are headers,
        #  from the ROCm apt repository it set up. Without them PHARE builds without thrust
        cd $(mktemp -d)
        if apt-get download rocthrust-dev rocprim-dev; then
          for d in *.deb; do dpkg-deb -x $d /; done
          ls /opt/rocm/include/thrust/sort.h
        else
          echo "::warning::no rocThrust, building without thrust"
        fi
    - name: mkn profiles for this GPU
      run: |
        sed -e "s/-DMKN_GPU_CUDA=0/-DMKN_GPU_CUDA=0 --offload-arch=gfx942/" \
          res/mkn/hip_thrust.yaml > res/mkn/hip_thrust_ci.yaml
        sed -e "s/^super: hip_thrust$/super: hip_thrust_ci/" \
          res/mkn/hip_thrust_mpi.yaml > res/mkn/hip_thrust_mpi_ci.yaml
        grep -n offload-arch res/mkn/hip_thrust_ci.yaml
        curl -Lo mkn https://github.com/mkn/mkn/releases/download/latest/mkn_nix
        chmod +x mkn && mv mkn /.venv/bin/mkn
        mkdir -p /mkn
    - name: Build/Test (mkn_rocm.sh)
      run: |
        . /.venv/bin/activate
        PROPS="samrai.ver=installed,HDF5_PTH=/usr/lib/x86_64-linux-gnu/hdf5/openmpi,HDF5_INC=/usr/include/hdf5/openmpi"
        CARGS="-P ${PROPS}" MKN_HIP=res/mkn/hip_thrust_ci MKN_HIP_MPI=res/mkn/hip_thrust_mpi_ci \
          vgpu run ./mkn_rocm.sh -O
